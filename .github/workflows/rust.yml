name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build_test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@master
      with:
        # Must match rust-toolchain.toml, which is the source of truth for
        # everyone building this fork. This line only tells the action which
        # toolchain to preinstall; rustup would otherwise fetch it on the
        # first cargo call anyway, reading the same file.
        toolchain: 1.97.1
    - name: Check no_std with alloc
      run: |
        cargo check --tests --no-default-features --features=alloc,grab_spare_slice,latest_stable_rust
    - name: Test
      run: |
        cargo test --features=alloc,std,grab_spare_slice,latest_stable_rust
