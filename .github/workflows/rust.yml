name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build_test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust:
        - 1.97.1 # the AdaWorldAPI workspace pin (rust-toolchain.toml)
        - stable
        - beta
        - nightly
        include:
          - rust: nightly
            os: windows-latest

    runs-on: ${{ matrix.os }}

    # rust-toolchain.toml pins 1.97.1 for local work and for anyone building
    # this fork directly. rustup honors that FILE over the toolchain
    # dtolnay/rust-toolchain installs, so without this the whole matrix
    # silently collapses to 1.97.1 -- and the nightly job's --all-features
    # then dies with E0554 (`#![feature]` may not be used on the stable
    # release channel). RUSTUP_TOOLCHAIN outranks the file, so the matrix
    # stays authoritative here while the pin still governs everywhere else.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    # The old check-only carve-out belonged to the 1.60.0 MSRV, where some
    # dev-dependencies did not build. 1.97.1 is the pin every consumer of this
    # fork builds on, so it runs the full test suite like any other channel --
    # a version that is only ever `cargo check`ed is not a version anyone has
    # evidence about.
    - name: Check no_std with alloc
      run: |
        cargo check --tests --no-default-features --features=alloc,grab_spare_slice,latest_stable_rust
    - name: Test non nightly
      if: matrix.rust != 'nightly'
      run: |
        cargo test --features=alloc,std,grab_spare_slice,latest_stable_rust
    - name: Test on Nightly with All Features
      if: matrix.rust == 'nightly'
      run: |
        cargo test --all-features
    # The #[debugger_visualizer] attribute is currently gated behind an unstable feature flag.
    # In order to test the visualizers for the tinyvec crate, they have to be tested on a nightly build.
    - name: Test debugger_visualizer feature on Nightly
      if: |
        matrix.os == 'windows-latest' &&
        matrix.rust == 'nightly'
      run: |
        cargo test --all-features --test debugger_visualizer -- --test-threads=1
